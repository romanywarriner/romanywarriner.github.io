<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart | From Pit To Print</title>

<link rel="stylesheet" href="style2.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header class="header-dark"> 

       <input type="checkbox" name="" id="toggler">
       <label for="toggler" class="fa fa-bars"></label>
       <a href="index2.html" class="logo-dark">From pit to print<span></span></a>
       
       <nav class="navbar">
       <a href="aboutpage.html">about</a>
       <a href="gallery2.html">gallery</a>
       <a href="shopping2.html">shopping</a>
       </nav>
       

    <div class="icons">

        <a href="cart2.html" class="fas fa-shopping-cart"></a>

    </div>

</header>


<section class="cart-page">

<h1 class="heading">

Your <span>Cart</span>

</h1>


<div id="cart-empty">

<h2>Your cart is empty.</h2>

<p>Add some prints to get started.</p>

<a href="shopping2.html" class="btn">

Continue Shopping

</a>

</div>


<div id="cart-content">

<div id="cart-items">

<!-- JavaScript creates everything -->

</div>

<div class="cart-summary">

<h2>Order Summary</h2>

<div class="summary-row">

<span>Subtotal</span>

<span id="subtotal">

£0.00

</span>

</div>

<div class="summary-row">

<span>Shipping</span>

<span>

FREE

</span>

</div>

<hr>

<div class="summary-row total">

<span>Total</span>

<span id="total">

£0.00

</span>

</div>

<a href="error.html" class="btn">
    Checkout
</a>

</div>

</div>

</section>

<script src="products.js"></script>

<script src="cart.js"></script>

<script src="script.js"></script>

</body>
